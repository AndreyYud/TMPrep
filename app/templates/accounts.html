{% extends "base.html" %}
{% block title %}Счета{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="page-title mb-0">Справочник счетов</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#accModal" onclick="clearAccForm()">
        <i class="bi bi-plus-circle"></i> Добавить счёт
    </button>
</div>

<div id="accountsList">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>
</div>

<!-- Модальное окно -->
<div class="modal fade" id="accModal" tabindex="-1" aria-labelledby="accModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="accModalLabel">Счёт</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="accForm">
                    <input type="hidden" id="accId">
                    <div class="mb-3">
                        <label for="accCode" class="form-label fw-semibold">Код счёта</label>
                        <input type="text" class="form-control" id="accCode" placeholder="Например: 60" required>
                    </div>
                    <div class="mb-3">
                        <label for="accName" class="form-label fw-semibold">Наименование</label>
                        <input type="text" class="form-control" id="accName" placeholder="Введите наименование счёта">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="saveAccBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let editAccId = null;

    function clearAccForm() {
        document.getElementById('accId').value = '';
        document.getElementById('accCode').value = '';
        document.getElementById('accName').value = '';
        editAccId = null;
        document.getElementById('accModalLabel').innerText = 'Добавить счёт';
    }

    async function loadAccounts() {
        const container = document.getElementById('accountsList');
        try {
            const res = await fetch('/api/v1/accounts/');
            if (!res.ok) throw new Error('Ошибка загрузки');
            const data = await res.json();
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <p class="text-muted">Нет счетов.</p>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#accModal" onclick="clearAccForm()">
                            <i class="bi bi-plus-circle"></i> Добавить первый счёт
                        </button>
                    </div>
                `;
                return;
            }
            let html = `
                <div class="card p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">Код счёта</th>
                                    <th style="width: 55%;">Наименование</th>
                                    <th style="width: 20%;" class="text-end">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
            data.forEach(acc => {
                html += `
                    <tr>
                        <td><span class="fw-semibold">${acc.code}</span></td>
                        <td>${acc.name || '<span class="text-muted">не указано</span>'}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-warning me-1" data-bs-toggle="modal" data-bs-target="#accModal" onclick="editAcc(${acc.id}, '${acc.code}', '${acc.name || ''}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteAcc(${acc.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-2 text-muted small">
                    Всего: <span class="badge-count">${data.length}</span>
                </div>
            `;
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = `<div class="alert alert-danger">Ошибка загрузки: ${err.message}</div>`;
        }
    }

    function editAcc(id, code, name) {
        editAccId = id;
        document.getElementById('accId').value = id;
        document.getElementById('accCode').value = code;
        document.getElementById('accName').value = name;
        document.getElementById('accModalLabel').innerText = 'Редактировать счёт';
    }

    async function deleteAcc(id) {
        if (!confirm('Удалить счёт? Это действие нельзя отменить.')) return;
        try {
            const res = await fetch(`/api/v1/accounts/${id}`, { method: 'DELETE' });
            if (res.ok) {
                await loadAccounts();
            } else {
                const err = await res.json();
                alert('Ошибка: ' + (err.detail || 'Неизвестная ошибка'));
            }
        } catch (err) {
            alert('Ошибка сети: ' + err.message);
        }
    }

    document.getElementById('saveAccBtn').addEventListener('click', async () => {
        const id = document.getElementById('accId').value;
        const code = document.getElementById('accCode').value.trim();
        const name = document.getElementById('accName').value.trim();
        if (!code) {
            alert('Код счёта обязателен');
            return;
        }
        const payload = { code, name: name || null };
        const url = id ? `/api/v1/accounts/${id}` : '/api/v1/accounts/';
        const method = id ? 'PUT' : 'POST';
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('accModal'));
                modal.hide();
                await loadAccounts();
            } else {
                const err = await res.json();
                alert('Ошибка: ' + (err.detail || 'Неизвестная ошибка'));
            }
        } catch (err) {
            alert('Ошибка сети: ' + err.message);
        }
    });

    loadAccounts();
</script>
{% endblock %}
